# Example Klipper configuration.
#
# Copy this section into printer.cfg after installing
# ai_spaghetti_detective.py into ~/klipper/klippy/extras/.

[pause_resume]

[ai_spaghetti_detective]
enabled: True

# Run one check after every N layer-change calls.
check_every_layers: 5

# First counted layer/call that may trigger a check. With check_every_layers: 5,
# the default first check is layer/call 5.
start_layer: 5

# Typical MJPG-streamer/Mainsail/Fluidd snapshot URLs. Use the one that works
# in your browser or shell on the Klipper host.
snapshot_url: http://127.0.0.1/webcam/?action=snapshot
# snapshot_url: http://127.0.0.1/webcam/snapshot
# snapshot_path: /tmp/klipper_snapshot.jpg

# Store the key in this file as plain text, chmod 600 if possible:
#   echo "sk-..." > ~/printer_data/config/openai_api_key
api_key_path: ~/printer_data/config/openai_api_key

# Low detail is cheaper and usually enough for spaghetti detection.
model: gpt-5-mini
image_detail: low

# Pause only when the model is fairly sure.
pause_on_failure: True
pause_statuses: failure
pause_confidence: 0.75
pause_gcode: PAUSE

# If the API/camera check fails, fail_open=True means "do not pause".
fail_open: True

[gcode_macro AI_SPAGHETTI_LAYER]
description: Call this from slicer layer-change G-code
gcode:
    AI_SPAGHETTI_CHECK

[gcode_macro AI_SPAGHETTI_TEST]
description: Force an immediate AI spaghetti check
gcode:
    AI_SPAGHETTI_CHECK FORCE=1
